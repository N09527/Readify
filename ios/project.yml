name: Readify
options:
  bundleIdPrefix: com.inkflow
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.4"
  generateEmptyDirectories: true

attributes:
  LastUpgradeCheck: "2640"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    DEAD_CODE_STRIPPING: YES

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.21
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.6
  Unrar:
    url: https://github.com/mtgto/Unrar.swift.git
    from: 0.5.4
  OpenCCSwift:
    path: Packages/OpenCCSwift

targets:
  Readify:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Readify
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inkflow.reader
        PRODUCT_NAME: Readify
        MARKETING_VERSION: 1.1.3
        CURRENT_PROJECT_VERSION: 13
        INFOPLIST_FILE: Readify/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: SwiftSoup
        product: SwiftSoup
      - package: Unrar
        product: Unrar
      - package: OpenCCSwift
        product: OpenCCSwift
