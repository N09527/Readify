name: Release Android APK & iOS IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "發佈版本號標籤（例如 v1.1.1 或 v1.2.0）"
        required: true
        default: "v1.1.1"
      prerelease:
        description: "標記為預覽版（Pre-release）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Android APK asset
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/dist/Readify-${TAG}-android-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: dist/*.apk
          if-no-files-found: error

  build-ios:
    name: Build Universal iOS/iPadOS Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode & Install XcodeGen
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Readify.xcodeproj \
            -scheme Readify \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages"

      - name: Build Release .app (Unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project Readify.xcodeproj \
            -scheme Readify \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/build/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package iOS Unsigned IPA asset
        working-directory: ios
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          APP_PATH="$PWD/build/DerivedData/Build/Products/Release-iphoneos/Readify.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Readify.app not found at $APP_PATH"
            exit 1
          fi
          rm -rf "$PWD/build/ipa" "$GITHUB_WORKSPACE/dist"
          mkdir -p "$PWD/build/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          cp -R "$APP_PATH" "$PWD/build/ipa/Payload/Readify.app"
          codesign --force --deep --sign - "$PWD/build/ipa/Payload/Readify.app"
          (
            cd "$PWD/build/ipa"
            zip -qry "$GITHUB_WORKSPACE/dist/Readify-${TAG}-ios-unsigned.ipa" Payload
          )
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built APK & IPA artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ls -lh release-assets/

          NOTES_HEADER=$(cat <<EOF
          ### 雙平台安裝檔說明
          - **Android 版 (\`Readify-${TAG}-android-debug.apk\`)**：適用於 Android 13～16（API 33–36），可直接安裝或覆蓋更新。
          - **iOS / iPadOS 版 (\`Readify-${TAG}-ios-unsigned.ipa\`)**：適用於 iPhone 與 iPad（iOS / iPadOS 16.0+），未簽名通用安裝包，請使用 **Sideloadly / SideStore / AltStore** 搭配一般免費 Apple ID 簽名側載安裝（詳見 \`ios/README.md\`）。
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            PRERELEASE_FLAG=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Readify ${TAG}" \
              --notes "$NOTES_HEADER" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
